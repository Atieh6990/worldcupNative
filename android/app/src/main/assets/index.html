<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=1920px;">
    <title>worldcup</title>
    <script type="text/javascript" src="$WEBAPIS/webapis/webapis.js"></script>
    <script type="text/javascript" src="js/jquery-1.12.4.min.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            overflow: hidden;
        }

        body {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 1920px;
            height: 1080px;
        }

        #app-loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #0d0d0d;
            z-index: 9999;
        }

        #app-loader.hidden {
            display: none;
        }

        .loader-spinner {
            width: 56px;
            height: 56px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #app {
            min-height: 100%;
        }
    </style>
</head>
<body>
<div id="app-loader">
    <div class="loader-spinner"></div>
</div>
<div id="app"></div>

<script>
    function notifyAppReady() {
        if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage(JSON.stringify({
                type: 'webReady',
                data: ''
            }));
        }
    }

    function hideLoader() {
        var loader = document.getElementById('app-loader');
        if (loader) {
            loader.className = 'hidden';
        }
    }

    function watchAppMount(onReady) {
        var app = document.getElementById('app');
        var readySent = false;

        function tryReady() {
            if (readySent || !app) {
                return;
            }

            if (app.children.length > 0) {
                readySent = true;
                observer.disconnect();
                clearInterval(pollTimer);
                clearTimeout(fallbackTimer);
                hideLoader();
                onReady();
            }
        }

        var observer = new MutationObserver(tryReady);
        observer.observe(app, { childList: true, subtree: true });
        var pollTimer = setInterval(tryReady, 100);
        var fallbackTimer = setTimeout(function () {
            if (!readySent) {
                readySent = true;
                observer.disconnect();
                clearInterval(pollTimer);
                hideLoader();
                onReady();
            }
        }, 15000);

        tryReady();
    }

    function startLoad() {
        var el = document.createElement('script');
        el.src = 'https://fifapanel.tvapps.ir/web/andriod/build.js?t=' + new Date().getTime();

        el.onload = function () {
            watchAppMount(notifyAppReady);
        };

        el.onerror = function () {
            hideLoader();
            notifyAppReady();
            document.addEventListener('keydown', function (e) {
                console.log('keydown', e);
                switch (e.keyCode) {
                    case 37:
                    case 38:
                    case 39:
                    case 40:
                    case 13:
                        break;
                    case 10009:
                    case 10182:
                        console.log('return888888888888888888888888');
                        break;
                    default:
                        console.log('Key code : ' + e.keyCode);
                        break;
                }
            });
        };

        document.body.appendChild(el);
    }

    startLoad();
</script>
</body>
</html>
